<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-label="The Triple placeholder">
  <defs>
    <pattern id="hatch" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <rect width="34" height="34" fill="#E9E2D3"/>
      <line x1="0" y1="0" x2="0" y2="34" stroke="#D9D0BC" stroke-width="9"/>
    </pattern>
  </defs>
  <rect width="1200" height="1000" fill="url(#hatch)"/>
  <ellipse cx="600" cy="430" rx="264" ry="170" fill="#F6F1E7" opacity="0.92"/>
  <circle cx="494" cy="400" r="35" fill="#5FAFA6"/>
